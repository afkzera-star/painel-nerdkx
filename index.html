<style>
:root{--bg:#120d24;--panel:#1c1538;--panel2:#261c4d;--line:#4b3a8f;--txt:#efeaff;--mut:#a79bd6;--on:#3dff9a;--wait:#ffc83d;--off:#6b6785;--acc:#ff4fd8;--cy:#36e2ff;--bad:#ff5a6a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.45 "Trebuchet MS",system-ui,sans-serif;
 background-image:linear-gradient(rgba(75,58,143,.15) 1px,transparent 1px),linear-gradient(90deg,rgba(75,58,143,.15) 1px,transparent 1px);background-size:24px 24px}
h1,h2,h3,.px{font-family:"Courier New",monospace;text-transform:uppercase;letter-spacing:1px}
a{color:var(--cy)}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:12px 16px;background:#0b0818;border-bottom:3px solid var(--line)}
header h1{margin:0;font-size:18px;color:var(--acc)}
#quota{min-width:260px;font-size:12px;color:var(--mut)}
.bar{height:10px;background:#0b0818;border:2px solid var(--line);margin-top:3px}
.bar i{display:block;height:100%;background:var(--cy)}
nav{display:flex;flex-wrap:wrap;gap:6px;padding:10px 16px;background:var(--panel)}
nav button,.btn{font:inherit;font-family:"Courier New",monospace;font-weight:bold;color:var(--txt);background:var(--panel2);border:3px solid var(--line);box-shadow:3px 3px 0 #000;padding:6px 10px;cursor:pointer}
nav button.active{background:var(--acc);color:#1a0b2e;border-color:#fff}
.btn:hover,nav button:hover{filter:brightness(1.2)}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 #000}
.btn.ok{background:#14663f;border-color:var(--on)}
.btn.warn{background:#6a4d00;border-color:var(--wait)}
.btn.danger{background:#6a1a26;border-color:var(--bad)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
main{padding:16px;max-width:1280px;margin:0 auto}
.card{background:var(--panel);border:3px solid var(--line);box-shadow:4px 4px 0 #000;padding:12px;margin-bottom:14px}

select,input[type=text],input[type=password],textarea{font:inherit;background:#0b0818;color:var(--txt);border:2px solid var(--line);padding:6px 8px}
textarea{width:100%;min-height:80px}

label{display:block;margin:10px 0 3px;font-weight:bold}

#banner.show{display:block}
#banner b{color:#ffb3bb}

/* fabrica */
.desks{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.desk{background:var(--panel);border:3px solid var(--line);box-shadow:4px 4px 0 #000;padding:10px;text-align:center;position:relative}
.desk svg{width:160px;height:144px;image-rendering:pixelated;shape-rendering:crispEdges}

.desk.off{opacity:.75} .desk.off .led{background:var(--off)} .desk.off .st{color:var(--off)}

.desk.wait .ic{animation:blink 1.4s steps(2) infinite}

.tag.novo{color:#1a0b2e;background:var(--cy);border-color:var(--cy)}
.tag.mine{color:#1a0b2e;background:var(--acc);border-color:var(--acc)}
.tag.baixo{color:var(--on);border-color:var(--on)} .tag.medio{color:var(--wait);border-color:var(--wait)} .tag.alto{color:var(--bad);border-color:var(--bad)}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px}
.ev{font-size:12px;margin:3px 0}
.avatar{width:36px;height:36px;border:2px solid var(--line);object-fit:cover;background:#000}

<header>

<script>
(function(){
'use strict';

/* ================= utilidades ================= */
var LS='fabrica.';
var DAY_QUOTA=10000;
var MIN_BASE=3;           // mínimo de vídeos (por formato) para calcular a mediana
var NOVO_DIAS=3;
var SHORT_MAX=180;        // segundos
var BRT=-3*3600e3;        // Brasília = UTC-3 (sem horário de verão desde 2019)

function $(s,el){return (el||document).querySelector(s);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function load(k,def){try{var v=localStorage.getItem(LS+k);return v==null?def:JSON.parse(v);}catch(e){return def;}}
function save(k,v){try{localStorage.setItem(LS+k,JSON.stringify(v));}catch(e){showBanner('Não consegui salvar no navegador (armazenamento cheio ou bloqueado). Seus dados desta sessão podem se perder.');}}
function pad(n){return String(n).padStart(2,'0');}
function fmtInt(n){return Number(n||0).toLocaleString('pt-BR');}
function fmtMult(m){return m==null?'—':m.toFixed(1).replace('.',',')+'x';}
function median(a){if(!a.length)return null;var s=a.slice().sort(function(x,y){return x-y;});var m=Math.floor(s.length/2);return s.length%2?s[m]:(s[m-1]+s[m])/2;}
function norm(s){return String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');}
function linkify(t){return esc(t).replace(/(https?:\/\/[^\s<]+[^\s<.,;:)])/g,'<a href="$1" target="_blank" rel="noopener">$1</a>');}
function brt(ms){var d=new Date(ms+BRT);return {y:d.getUTCFullYear(),m:d.getUTCMonth()+1,d:d.getUTCDate(),h:d.getUTCHours(),mi:d.getUTCMinutes(),wd:d.getUTCDay()};}
function dayStr(p){return p.y+'-'+pad(p.m)+'-'+pad(p.d);}
function fmtDate(ms){var p=brt(ms);return pad(p.d)+'/'+pad(p.m)+'/'+p.y;}
function fmtDT(ms){var p=brt(ms);return pad(p.d)+'/'+pad(p.m)+' '+pad(p.h)+':'+pad(p.mi);}
function addDays(ds,n){var a=ds.split('-').map(Number);var d=new Date(Date.UTC(a[0],a[1]-1,a[2]+n));return d.getUTCFullYear()+'-'+pad(d.getUTCMonth()+1)+'-'+pad(d.getUTCDate());}
function slotMs(ds,h){var a=ds.split('-').map(Number);return Date.UTC(a[0],a[1]-1,a[2],h)-BRT;}
function normHandle(h){return String(h||'').trim().replace(/^@/,'').toLowerCase();}

/* ================= estado ================= */
var DEFAULT_CFG={apiKey:'',myHandle:'@NerdKx',hours:[8,10,12,16,20,22],lang:'pt',niche:'nerd geek pop games',exemplos:[]};
var S={
  cfg:Object.assign({},DEFAULT_CFG,load('cfg',{})),
  channels:load('channels',null)||[{handle:'@NerdKx',mine:true},{handle:'@DavyJonesGTA6'},{handle:'@einerdtv'}],
  videos:load('videos',{}),
  quota:load('quota',{day:'',used:0,searches:0}),
  pautas:load('pautas',{}),
  agenda:load('agenda',{}),
  diary:load('diary',[]),
  filt:{formato:'short',periodo:'90',canal:'all',sort:'mult',dir:'desc',limit:100},
  tab:'fabrica',
  busy:false,
  weekOffset:0,
  disc:{q:'',lang:'pt',busca:null,indicados:null,msg:''},
  pautaFilt:'todas'
};
function saveCfg(){save('cfg',S.cfg);}
function saveChannels(){save('channels',S.channels);}
function saveVideos(){save('videos',S.videos);}

/* ================= cota ================= */
function pacificDay(){return new Intl.DateTimeFormat('en-CA',{timeZone:'America/Los_Angeles',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());}
function quotaNow(){var d=pacificDay();if(S.quota.day!==d){S.quota={day:d,used:0,searches:0};save('quota',S.quota);}return S.quota;}
function quotaTick(cost,isSearch){var q=quotaNow();q.used+=cost;if(isSearch)q.searches++;save('quota',q);renderQuota();}
function renderQuota(){
  var q=quotaNow();var pct=Math.min(100,q.used/DAY_QUOTA*100);
  var el=$('#quota');if(!el)return;
  el.innerHTML='Cota de hoje: <b>'+fmtInt(q.used)+'</b> / '+fmtInt(DAY_QUOTA)+' unidades · buscas: <b>'+q.searches+'</b> (100 un. cada, máx. 100/dia)'+
   '<div class="bar"><i style="width:'+pct+'%;background:'+(pct>85?'var(--bad)':pct>60?'var(--wait)':'var(--cy)')+'"></i></div>'+
   '<span style="font-size:11px">Contagem feita por este painel; o número oficial está no Google Cloud. Zera à meia-noite do Pacífico (~04h–05h em Brasília).</span>';
}

/* ================= API ================= */
function ApiError(kind,msg,detail){var e=new Error(msg);e.name='ApiError';e.kind=kind;e.detail=detail||{};return e;}
var FATAL={semchave:1,chave:1,apidesligada:1,referrer:1,cota:1,servico:1,rede:1};

function mapError(status,body){
  var e=(body&&body.error)||{};var e0=(e.errors&&e.errors[0])||{};
  var det=(e.details||[]).map(function(d){return d.reason||'';}).join(' ');
  var all=(String(e0.reason||'')+' '+String(e.status||'')+' '+det+' '+String(e.message||'')).toLowerCase();
  var origin=(location.origin&&location.origin!=='null')?location.origin:'(arquivo aberto direto do PC)';
  if(/referrer_blocked|referer.*blocked|referrer.*blocked|iprefererblocked/.test(all)||/api_key_http_referrer_blocked/.test(all)){
    return ApiError('referrer','RESTRIÇÃO DE SITE: a chave só aceita certos endereços e este não está na lista. Você abriu o painel em: '+origin+'\nEm https://console.cloud.google.com/apis/credentials → sua chave → "Restrições de aplicativo" → Sites, adicione o endereço do seu painel terminando com /* (exemplo: https://afkzera-star.github.io/*). Abrir o index.html direto do computador não funciona com chave restrita: use o endereço github.io.',{status:status});
  }
  if(/api_key_service_blocked|are blocked|service_blocked/.test(all)&&/youtube|api_key_service/.test(all)){
    return ApiError('servico','A chave está restrita a outras APIs e não inclui a YouTube Data API v3. Em https://console.cloud.google.com/apis/credentials → sua chave → "Restrições de API", marque YouTube Data API v3.',{status:status});
  }
  if(/accessnotconfigured|service_disabled|has not been used in project|api.*is disabled|api.*not enabled/.test(all)){
    return ApiError('apidesligada','A YouTube Data API v3 está DESLIGADA no seu projeto do Google Cloud. Ative em https://console.cloud.google.com/apis/library/youtube.googleapis.com (botão "Ativar") e tente de novo em 1–2 minutos.',{status:status});
  }
  if(/quotaexceeded|dailylimitexceeded|ratelimitexceeded|userratelimitexceeded|quota/.test(all)){
    return ApiError('cota','COTA ESGOTADA: o limite diário gratuito da API acabou. Ele volta à meia-noite do horário do Pacífico (cerca de 04h–05h da manhã em Brasília). Enquanto isso o painel continua mostrando os dados já carregados.',{status:status});
  }
  if(/keyinvalid|api_key_invalid|api key not valid|invalid api key|badrequest/.test(all)&&(status===400||status===403)){
    return ApiError('chave','CHAVE INVÁLIDA: o Google não reconheceu essa chave. Confira se copiou ela inteira, sem espaços, na aba Configuração. Se acabou de criar, espere 1–2 minutos. Suas chaves: https://console.cloud.google.com/apis/credentials',{status:status});
  }
  if(status===404||/notfound/.test(all)){return ApiError('naoachou','Não encontrado pela API (404).',{status:status});}
  return ApiError('outro','Erro da API ('+status+'): '+(e.message||'sem detalhes'),{status:status});
}

async function api(endpoint,params,cost,opts){
  opts=opts||{};
  var key=String(S.cfg.apiKey||'').trim();
  if(!key)throw ApiError('semchave','Falta a chave da API. Abra a aba Configuração e cole sua chave (veja o LEIA-ME para criá-la).');
  var q=quotaNow();
  if(q.used+cost>DAY_QUOTA)throw ApiError('cota','COTA ESGOTADA (pela contagem do painel): '+fmtInt(q.used)+' de '+fmtInt(DAY_QUOTA)+' unidades usadas hoje. Volta à meia-noite do Pacífico (~04h–05h em Brasília).');
  var p=new URLSearchParams();
  Object.keys(params).forEach(function(k){p.set(k,params[k]);});
  p.set('key',key);
  var res;
  try{res=await fetch('https://www.googleapis.com/youtube/v3/'+endpoint.replace(/\.list$/,'')+'?'+p.toString());}
  catch(err){throw ApiError('rede','Não consegui falar com o YouTube: sem internet, ou algo (extensão, firewall, bloqueador) barrou a conexão com www.googleapis.com.');}
  var body=null;try{body=await res.json();}catch(e){}
  if(!res.ok)throw mapError(res.status,body);
  quotaTick(cost,!!opts.search);
  return body||{};
}

/* ================= canais e vídeos ================= */
function parseChannelInput(txt){
  txt=String(txt||'').trim();if(!txt)return null;var m;
  if((m=txt.match(/youtube\.com\/channel\/(UC[\w-]{20,})/i)))return {id:m[1]};
  if((m=txt.match(/youtube\.com\/@([^\/?#\s]+)/i))){var h=m[1];try{h=decodeURIComponent(h);}catch(e){}return {handle:'@'+h};}
  if((m=txt.match(/youtube\.com\/user\/([^\/?#\s]+)/i)))return {username:m[1]};
  if((m=txt.match(/youtube\.com\/c\/([^\/?#\s]+)/i)))return {handle:'@'+m[1]};
  if(/^UC[\w-]{20,}$/.test(txt))return {id:txt};
  if((m=txt.match(/^@?([^\s\/@]+)$/)))return {handle:'@'+m[1]};
  return null;
}
function chanMeta(it){
  var sn=it.snippet||{},st=it.statistics||{},cd=it.contentDetails||{};
  var cu=sn.customUrl||'';
  return {id:it.id,title:sn.title||it.id,handle:cu?(cu.charAt(0)==='@'?cu:'@'+cu):null,
    thumb:(sn.thumbnails&&(sn.thumbnails.default||sn.thumbnails.medium)||{}).url||'',
    subs:st.hiddenSubscriberCount?null:(st.subscriberCount!=null?Number(st.subscriberCount):null),
    videoCount:st.videoCount!=null?Number(st.videoCount):null,
    uploads:cd.relatedPlaylists&&cd.relatedPlaylists.uploads||null,
    lang:sn.defaultLanguage||null,country:sn.country||null};
}
async function fetchChannel(ref){
  var p={part:'snippet,contentDetails,statistics'};
  if(ref.id)p.id=ref.id;else if(ref.handle)p.forHandle=ref.handle;else if(ref.username)p.forUsername=ref.username;
  var r=await api('channels.list',p,1);
  var it=r.items&&r.items[0];
  if(!it)throw ApiError('naoachou','Canal não encontrado: '+(ref.handle||ref.id||ref.username)+'. Confira o @ (copie do link do canal no YouTube).');
  return chanMeta(it);
}
function findChan(id){return S.channels.filter(function(c){return c.id===id;})[0];}
function mineChan(){return S.channels.filter(function(c){return c.mine;})[0];}

async function loadVideos(ch){
  if(!ch.uploads&&ch.id)ch.uploads='UU'+ch.id.slice(2);
  var pl=await api('playlistItems.list',{part:'contentDetails',playlistId:ch.uploads,maxResults:50},1);
  var ids=(pl.items||[]).map(function(i){return i.contentDetails&&i.contentDetails.videoId;}).filter(Boolean);
  var items=[];
  if(ids.length){
    var v=await api('videos.list',{part:'snippet,statistics,contentDetails',id:ids.join(',')},1);
    (v.items||[]).forEach(function(x){
      var dur=parseDuration(x.contentDetails&&x.contentDetails.duration);
      if(!dur)return;                                   // ao vivo/estreia sem duração
      if(x.snippet&&x.snippet.liveBroadcastContent&&x.snippet.liveBroadcastContent!=='none')return;
      items.push({id:x.id,title:x.snippet.title,views:Number(x.statistics&&x.statistics.viewCount)||0,dur:dur,pub:x.snippet.publishedAt,short:dur<=SHORT_MAX});
    });
  }
  S.videos[ch.id]={fetchedAt:Date.now(),items:items};
  saveVideos();
  return items.length;
}
function parseDuration(iso){
  var m=/^P(?:(\d+)D)?(?:T(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?)?$/.exec(iso||'');
  if(!m)return 0;
  return (+m[1]||0)*86400+(+m[2]||0)*3600+(+m[3]||0)*60+(+m[4]||0);
}

/* ================= multiplicadores ================= */
function computeRows(){
  var now=Date.now(),rows=[];
  S.channels.forEach(function(ch){
    var c=ch.id&&S.videos[ch.id];if(!c)return;
    [true,false].forEach(function(fmt){
      var group=c.items.filter(function(v){return v.short===fmt;});
      var elig=group.filter(function(v){return now-Date.parse(v.pub)>=NOVO_DIAS*864e5;});
      var med=elig.length>=MIN_BASE?median(elig.map(function(v){return v.views;})):null;
      group.forEach(function(v){
        var novo=now-Date.parse(v.pub)<NOVO_DIAS*864e5;
        rows.push({id:v.id,title:v.title,views:v.views,dur:v.dur,pub:v.pub,short:v.short,ch:ch,novo:novo,med:med,mult:(med&&med>0)?v.views/med:null});
      });
    });
  });
  return rows;
}
function filterRows(rows){
  var f=S.filt,now=Date.now();
  var days=f.periodo==='90'?90:f.periodo==='365'?365:null;
  var out=rows.filter(function(r){
    if(f.formato==='short'&&!r.short)return false;
    if(f.formato==='longo'&&r.short)return false;
    if(f.canal!=='all'&&r.ch.id!==f.canal)return false;
    if(days&&now-Date.parse(r.pub)>days*864e5)return false;
    return true;
  });
  var k=f.sort,dir=f.dir==='asc'?1:-1;
  out.sort(function(a,b){
    var va,vb;
    if(k==='views'){va=a.views;vb=b.views;}
    else if(k==='data'){va=Date.parse(a.pub);vb=Date.parse(b.pub);}
    else{va=a.mult;vb=b.mult;}
    if(va==null&&vb==null)return 0;
    if(va==null)return 1;if(vb==null)return -1;   // sem multiplicador sempre no fim
    return (va-vb)*dir;
  });
  return out;
}

/* ================= pautas ================= */
var STOP=new Set(('de da do das dos em no na nos nas um uma uns umas o a os as e ou que com para por pra como mais mas se ao aos seu sua seus suas isso esse essa esses essas este esta estes estas eu voce voces nao sim muito muita ja foi sao ser tem ter vai vou era the and for with you your this that from are was not how why what when who will new best top video videos parte part ep episodio ate sobre entre depois antes quando onde qual quais todo toda todos todas tudo nada sem mesmo ainda fazer fez faz aqui ali la so tambem novo nova novos novas veja confira saiba incrivel urgente oficial finalmente').split(' ').map(norm));
function tokens(t){
  var seen={};
  return norm(t).split(/[^a-z0-9]+/).filter(function(w){
    if(w.length<3||STOP.has(w)||/^\d+$/.test(w)||seen[w])return false;seen[w]=1;return true;});
}
function mkPauta(id,kw,g){
  g=g.slice().sort(function(a,b){return b.mult-a.mult;});
  var evid=g.slice(0,5).map(function(r){return {id:r.id,title:r.title,canal:r.ch.title||r.ch.handle,mult:r.mult,views:r.views,short:r.short,novo:r.novo};});
  var shorts=g.filter(function(r){return r.short;}).length;
  var formato=shorts===g.length?'Short':shorts===0?'Longo':'Misto';
  var n=g.length,nc={};g.forEach(function(r){nc[r.ch.id]=1;});nc=Object.keys(nc).length;
  var allNovo=g.every(function(r){return r.novo;});
  var risco,motivo;
  if(n>=3&&nc>=2){risco='Baixo';motivo='tema repetido em '+n+' vídeos de '+nc+' canais';}
  else if(n>=2||nc>=2){risco='Médio';motivo=n+' vídeos de '+nc+' canal(is) apontam para o tema';}
  else{risco='Alto';motivo='só 1 vídeo comprova; pode ter sido sorte ou algo pontual';}
  if(allNovo&&risco!=='Alto'){risco=risco==='Baixo'?'Médio':'Alto';motivo+='; todos os vídeos têm menos de 3 dias';}
  var top=g[0];
  return {id:id,tema:(kw&&kw.length)?(kw.join(' · ').toUpperCase()+' ('+n+' vídeos)'):top.title,exemplo:top.title,formato:formato,risco:risco,motivo:motivo,evid:evid,mediaMult:g.reduce(function(s,r){return s+r.mult;},0)/n};
}
function tokenMap(t){
  var m={};String(t).split(/[^A-Za-zÀ-ÿ0-9]+/).forEach(function(w){var n=norm(w);if(n.length>=3&&!STOP.has(n)&&!/^\d+$/.test(n)&&!m[n])m[n]=w;});return m;
}
function buildPautas(rows){
  // outliers de concorrentes (>= 2x), do maior para o menor
  var out=rows.filter(function(r){return !r.ch.mine&&r.mult!=null&&r.mult>=2;}).sort(function(a,b){return b.mult-a.mult;}).slice(0,60);
  out.forEach(function(r){r._tok=tokens(r.title);r._map=tokenMap(r.title);});
  var used={},pautas=[];
  out.forEach(function(seed){
    if(pautas.length>=14||used[seed.id])return;
    // junta vídeos que dividem pelo menos 2 palavras com o campeão (uma palavra solta, como "novo", não basta)
    var g=[seed];
    out.forEach(function(o){
      if(o===seed||used[o.id])return;
      var shared=o._tok.filter(function(t){return seed._tok.indexOf(t)>=0;}).length;
      if(shared>=2)g.push(o);
    });
    g.forEach(function(r){used[r.id]=1;});
    if(g.length===1){pautas.push(mkPauta('v:'+seed.id,null,g));return;}
    var freq={};g.forEach(function(r){r._tok.forEach(function(t){freq[t]=(freq[t]||0)+1;});});
    var kw=seed._tok.filter(function(t){return freq[t]>=2;}).sort(function(a,b){return freq[b]-freq[a];}).slice(0,3).map(function(t){return seed._map[t]||t;});
    pautas.push(mkPauta('g:'+seed.id,kw,g));
  });
  return pautas;
}
function allPautas(){
  var cur=buildPautas(computeRows());var ids={};cur.forEach(function(p){ids[p.id]=1;});
  Object.keys(S.pautas).forEach(function(id){var s=S.pautas[id];if(!ids[id]&&s&&s.snap&&(s.status==='aprovada'||s.status==='revisar')){cur.push(s.snap);}});
  return cur;
}
function pautaStatus(id){return (S.pautas[id]&&S.pautas[id].status)||'pendente';}
function promptPauta(p){
  var st=S.pautas[p.id]||{};
  var ev=p.evid.map(function(e,i){return (i+1)+'. "'+e.title+'" — canal '+e.canal+' — '+fmtMult(e.mult)+' a mediana do canal ('+fmtInt(e.views)+' views, '+(e.short?'Short':'vídeo longo')+')';}).join('\n');
  var ex=(S.cfg.exemplos||[]).length?'\nMeus títulos de exemplo (imite o estilo):\n'+S.cfg.exemplos.map(function(t){return '- '+t;}).join('\n')+'\n':'';
  return 'Você é meu roteirista de Shorts para o canal "'+(mineChan()&&mineChan().title||'NerdKx')+'" ('+S.cfg.myHandle+'), nicho: '+S.cfg.niche+'.\n\n'+
   'Pauta aprovada: '+p.tema+'\nFormato das evidências: '+p.formato+' · Risco: '+p.risco+' ('+p.motivo+')\n\n'+
   'Evidências (vídeos de concorrentes que performaram acima do normal do próprio canal):\n'+ev+'\n'+ex+
   (st.nota?'\nMinhas observações sobre a pauta: '+st.nota+'\n':'')+
   '\nO que eu preciso:\n1) 5 opções de título para Short, com no máximo 55 caracteres, só 1 a 2 palavras em CAIXA ALTA, primeira letra maiúscula, sem inventar números ou fatos que não estejam na pauta.\n'+
   '2) Um roteiro de Short de 30 a 45 segundos: gancho na primeira frase, desenvolvimento rápido e fecho em frase completa, sem pedir inscrição.\n'+
   '3) Diga em uma linha por que essa pauta pode funcionar e qual o principal risco.';
}

function sprite(a){

  var pal={h:a.hair,s:'#f2c28f',e:'#1a1a1a',c:a.cor,m:'#2b2b3d',g:scr[0],G:scr[1],d:'#8a5a2b',l:'#4a2f14'};

function ensureMine(){
  var h=normHandle(S.cfg.myHandle);
  S.channels=S.channels.filter(function(c){return !(c.mine&&normHandle(c.handle)!==h);});
  var ex=S.channels.filter(function(c){return normHandle(c.handle)===h;})[0];
  if(ex)ex.mine=true;else if(h)S.channels.unshift({handle:'@'+h,mine:true});
  saveChannels();
}
async function refreshAll(){
  if(S.busy)return;
  hideBanner();S.busy=true;render();
  var n=0,failed=false;
  try{
    for(var i=0;i<S.channels.length;i++){
      var ch=S.channels[i];
      try{
        if(!ch.id){
          var ref=ch.handle?{handle:ch.handle}:null;if(!ref)continue;
          var meta=await fetchChannel(ref);Object.assign(ch,meta,{handle:ch.handle||meta.handle});saveChannels();
        }
        var c=await loadVideos(ch);n++;
        log('Radar','Atualizou '+(ch.title||ch.handle)+': '+c+' vídeos lidos.');
        render();
      }catch(err){
        handleErr(err,'Radar');
        if(err.kind&&FATAL[err.kind]){failed=true;break;}
      }
    }
  }finally{S.busy=false;}
  if(!failed&&n)log('Radar','Radar concluído: '+n+' canal(is).');
  render();
}
async function addChannelRef(ref,already){
  try{
    var meta=already||await fetchChannel(ref);
    if(findChan(meta.id)){showBanner('Esse canal já está no radar: '+meta.title,true);return;}
    var ch=Object.assign({},meta);if(ref&&ref.handle&&!ch.handle)ch.handle=ref.handle;
    S.channels.push(ch);saveChannels();
    log('Radar','Canal adicionado: '+ch.title+'. Lendo vídeos…');render();
    var c=await loadVideos(ch);log('Radar',ch.title+': '+c+' vídeos lidos.');
    toast('Canal adicionado: '+ch.title);
  }catch(err){handleErr(err,'Radar');}
  render();
}
async function refreshOne(id){

function removeChannel(id){
  var ch=findChan(id);if(!ch||ch.mine)return;
  S.channels=S.channels.filter(function(c){return c.id!==id;});delete S.videos[id];
  saveChannels();saveVideos();log('Radar','Canal removido: '+ch.title);render();

function discItem(meta,extra){return Object.assign({id:meta.id,meta:meta},extra||{});}
async function discoverSearch(){
  var q=($('#dq')||{}).value||'',lang=($('#dl')||{}).value||'pt';
  S.disc.q=q;S.disc.lang=lang;
  if(!q.trim()){showBanner('Digite um tema para buscar (ex.: gta 6, animes, filmes).',true);return;}
  hideBanner();S.disc.msg='Buscando…';render();
  try{
    var p={part:'snippet',type:'channel',q:q,maxResults:15,relevanceLanguage:lang};
    if(lang==='pt')p.regionCode='BR';
    var r=await api('search.list',p,100,{search:true});
    var ids=(r.items||[]).map(function(i){return (i.id&&i.id.channelId)||(i.snippet&&i.snippet.channelId);}).filter(Boolean);
    var list=[];
    if(ids.length){
      var d=await api('channels.list',{part:'snippet,statistics',id:ids.join(',')},1);
      var by={};(d.items||[]).forEach(function(it){by[it.id]=chanMeta(it);});
      ids.forEach(function(id){if(by[id])list.push(discItem(by[id]));});
    }
    var total=list.length;
    list=list.filter(function(x){return !x.meta.lang||x.meta.lang.toLowerCase().indexOf(lang)===0;});
    S.disc.busca=list;
    S.disc.msg=total+' canais encontrados'+(total!==list.length?' ('+(total-list.length)+' escondidos por idioma)':'')+'.';
    log('Radar','Busca por "'+q+'": '+total+' canais.');
  }catch(err){S.disc.msg='';handleErr(err,'Radar');}
  render();
}
async function discoverIndicados(){
  hideBanner();
  var comps=S.channels.filter(function(c){return !c.mine&&c.id;});
  if(!comps.length){showBanner('Primeiro atualize o radar para os concorrentes serem identificados (aba Radar → Atualizar tudo).',true);return;}
  S.disc.msg='Lendo as páginas dos concorrentes…';render();
  try{
    var cit={},anyS=0;
    for(var i=0;i<comps.length;i++){
      var c=comps[i];
      var r=await api('channelSections.list',{part:'contentDetails',channelId:c.id},1);
      (r.items||[]).forEach(function(sec){
        var arr=sec.contentDetails&&sec.contentDetails.channels;if(!arr||!arr.length)return;anyS++;
        arr.forEach(function(id){if(id===c.id)return;(cit[id]=cit[id]||{}) [c.id]=1;});
      });
    }
    var tracked={};S.channels.forEach(function(c){if(c.id)tracked[c.id]=1;});
    var ids=Object.keys(cit).filter(function(id){return !tracked[id];}).sort(function(a,b){return Object.keys(cit[b]).length-Object.keys(cit[a]).length||a.localeCompare(b);}).slice(0,20);
    var list=[];
    if(ids.length){
      var d=await api('channels.list',{part:'snippet,statistics',id:ids.join(',')},1);
      var by={};(d.items||[]).forEach(function(it){by[it.id]=chanMeta(it);});
      ids.forEach(function(id){if(by[id]){list.push(discItem(by[id],{citadoPor:Object.keys(cit[id]).map(function(cid){var cc=findChan(cid);return cc&&cc.title||cid;})}));}});
    }
    S.disc.indicados=list;
    S.disc.msg=list.length?list.length+' canais indicados.':(anyS?'Todos os canais indicados já estão no seu radar.':'Seus concorrentes não destacam outros canais na página inicial (seção "Canais em destaque"), então não há indicações.');
    log('Radar','Indicações lidas de '+comps.length+' concorrentes: '+list.length+' canais.');
  }catch(err){S.disc.msg='';handleErr(err,'Radar');}
  render();
}

function ownShortSlots(){
  var m=mineChan(),set={};
  if(!m||!m.id||!S.videos[m.id])return set;
  S.videos[m.id].items.forEach(function(v){if(!v.short)return;var p=brt(Date.parse(v.pub));set[dayStr(p)+'|'+p.h]=v.title;});
  return set;
}
function weekDays(){
  var p=brt(Date.now()),today=dayStr(p);
  var monday=addDays(today,-((p.wd+6)%7)+S.weekOffset*7);
  var out=[];for(var i=0;i<7;i++)out.push(addDays(monday,i));return out;
}
function hoursList(){return (S.cfg.hours||[]).slice().sort(function(a,b){return a-b;});}
function autoFill(){
  var ap=allPautas().filter(function(p){return pautaStatus(p.id)==='aprovada';});
  var assigned={};Object.keys(S.agenda).forEach(function(k){assigned[S.agenda[k]]=1;});
  var queue=ap.filter(function(p){return !assigned[p.id];});
  if(!queue.length){toast('Nenhuma pauta aprovada sobrando.');return;}
  var occ=ownShortSlots(),hours=hoursList(),today=dayStr(brt(Date.now())),n=0;
  for(var d=0;d<90&&queue.length;d++){
    var ds=addDays(today,d);
    for(var i=0;i<hours.length&&queue.length;i++){
      var key=ds+'|'+hours[i];
      if(slotMs(ds,hours[i])<=Date.now()||S.agenda[key]||occ[key])continue;
      S.agenda[key]=queue.shift().id;n++;
    }
  }
  save('agenda',S.agenda);log('Agenda',n+' pauta(s) encaixada(s) nos próximos horários livres.');toast(n+' pauta(s) agendada(s).');render();
}

     '<td><a href="'+url+'" target="_blank" rel="noopener">'+esc(r.title)+'</a>'+(r.novo?'<span class="tag novo">NOVO</span>':'')+'</td>'+
     '<td>'+esc(r.ch.title||r.ch.handle)+(r.ch.mine?'<span class="tag mine">EU</span>':'')+'</td>'+
     '<td class="num"><span class="mult '+cls+'" title="Mediana do canal neste formato: '+(r.med==null?'poucos vídeos para calcular':fmtInt(Math.round(r.med))+' views')+'">'+fmtMult(r.mult)+'</span></td>'+
     '<td class="num">'+fmtInt(r.views)+'</td><td class="num">'+fmtDate(Date.parse(r.pub))+'</td><td class="num">'+Math.floor(r.dur/60)+':'+pad(r.dur%60)+'</td></tr>';
  }).join('');
  var empty=!rows.length?'<p class="mut">Ainda não há dados. '+(String(S.cfg.apiKey||'').trim()?'Clique em "Atualizar tudo".':'Cole sua chave em Configuração primeiro.')+'</p>':(!list.length?'<p class="mut">Nenhum vídeo com esses filtros.</p>':'');
  var last=Object.keys(S.videos).map(function(id){return S.videos[id].fetchedAt;}).sort().pop();
  return '<div class="card"><div class="row"><button class="btn ok" data-act="refresh"'+(S.busy?' disabled':'')+'>'+(S.busy?'Lendo canais…':'Atualizar tudo')+'</button>'+
   '<span class="mut">'+(last?'Última leitura: '+fmtDT(last)+' · ':'')+'cada canal custa ~3 unidades de cota</span></div>'+
   '<div class="row" style="margin-top:10px">'+
   '<label style="margin:0">Formato <select data-change="formato"><option value="short"'+(f.formato==='short'?' selected':'')+'>Shorts (até 3 min)</option><option value="longo"'+(f.formato==='longo'?' selected':'')+'>Vídeos longos</option></select></label>'+
   '<label style="margin:0">Período <select data-change="periodo"><option value="90"'+(f.periodo==='90'?' selected':'')+'>90 dias</option><option value="365"'+(f.periodo==='365'?' selected':'')+'>1 ano</option><option value="all"'+(f.periodo==='all'?' selected':'')+'>Tudo</option></select></label>'+
   '<label style="margin:0">Canal <select data-change="canal">'+chOpts+'</select></label></div>'+
   '<p class="mut" style="margin:8px 0 0">Multiplicador = views ÷ mediana dos últimos 50 vídeos do próprio canal, no mesmo formato. Vídeos com menos de 3 dias ficam fora da mediana e levam a marca NOVO. Precisa de pelo menos '+MIN_BASE+' vídeos do formato para calcular.</p></div>'+
   '<div class="card tw">'+empty+(list.length?'<table><thead><tr><th></th><th>Título</th><th>Canal</th>'+th('mult','Multiplicador')+th('views','Views')+th('data','Data')+'<th>Duração</th></tr></thead><tbody>'+body+'</tbody></table>'+
   '<p class="mut">Mostrando '+shown.length+' de '+list.length+'.'+(list.length>shown.length?' <button class="btn" data-act="more">Mostrar mais</button>':'')+'</p>':'')+'</div>';
}

function viewCanais(){
  var rows=computeRows();
  var tr=S.channels.map(function(ch,i){
    var mine=rows.filter(function(r){return ch.id&&r.ch.id===ch.id;});
    var withM=mine.filter(function(r){return r.mult!=null;});
    var max=withM.length?Math.max.apply(null,withM.map(function(r){return r.mult;})):null;
    var over=withM.filter(function(r){return r.mult>=2;}).length;
    var upd=ch.id&&S.videos[ch.id]?fmtDT(S.videos[ch.id].fetchedAt):'—';
    return '<tr><td>'+(ch.thumb?'<img class="avatar" alt="" src="'+esc(ch.thumb)+'">':'')+'</td><td><b>'+esc(ch.title||ch.handle)+'</b>'+(ch.mine?'<span class="tag mine">MEU CANAL</span>':'')+'<br><span class="mut">'+esc(ch.handle||ch.id||'')+'</span></td>'+
     '<td class="num">'+(ch.id&&S.videos[ch.id]?S.videos[ch.id].items.length:'—')+'</td><td class="num">'+fmtMult(max)+'</td><td class="num">'+(ch.id?over:'—')+'</td><td>'+upd+'</td>'+
     '<td>'+(ch.id?'<button class="btn" data-act="refresh-one" data-id="'+esc(ch.id)+'">Atualizar</button> ':'')+(ch.mine?'':(ch.id?'<button class="btn danger" data-act="remove" data-id="'+esc(ch.id)+'">Remover</button>':'<button class="btn danger" data-act="remove-i" data-i="'+i+'">Remover</button>'))+'</td></tr>';
  }).join('');
  return '<div class="card"><h2>Adicionar canal</h2><div class="row"><input type="text" id="addin" placeholder="@handle ou link do canal (ex.: https://www.youtube.com/@einerdtv)"><button class="btn ok" data-act="add">Adicionar</button></div>'+
   '<p class="mut">Cada canal novo gasta ~3 unidades de cota (1 para achar o canal, 1 para a lista de vídeos, 1 para os números).</p></div>'+
   '<div class="card tw"><h2>Canais no radar ('+S.channels.length+')</h2><table><thead><tr><th></th><th>Canal</th><th>Vídeos analisados</th><th>Maior multiplicador</th><th>Passam de 2x</th><th>Atualizado</th><th></th></tr></thead><tbody>'+tr+'</tbody></table></div>';
}

function discCard(x,kind){
  var m=x.meta;var tracked=!!findChan(m.id);
  return '<tr><td>'+(m.thumb?'<img class="avatar" alt="" src="'+esc(m.thumb)+'">':'')+'</td><td><b>'+esc(m.title)+'</b><br><span class="mut">'+esc(m.handle||m.id)+(m.lang?' · '+esc(m.lang):'')+(m.country?' · '+esc(m.country):'')+'</span>'+
   (x.citadoPor?'<br><span class="mut">Citado por '+x.citadoPor.length+': '+esc(x.citadoPor.join(', '))+'</span>':'')+'</td>'+
   '<td class="num">'+(m.subs==null?'oculto':fmtInt(m.subs))+'</td><td class="num">'+(m.videoCount==null?'—':fmtInt(m.videoCount))+'</td>'+
   '<td>'+(tracked?'<span class="mut">já no radar</span>':'<button class="btn ok" data-act="add-found" data-kind="'+kind+'" data-id="'+esc(m.id)+'">Adicionar ao radar</button>')+'</td></tr>';
}
function viewDescobrir(){
  var d=S.disc;
  function tab(list,kind){return list&&list.length?'<table><thead><tr><th></th><th>Canal</th><th>Inscritos</th><th>Vídeos</th><th></th></tr></thead><tbody>'+list.map(function(x){return discCard(x,kind);}).join('')+'</tbody></table>':'';}
  return '<div class="card"><h2>1) Buscar por tema</h2><div class="row"><input type="text" id="dq" value="'+esc(d.q||S.cfg.niche)+'" placeholder="tema, ex.: gta 6, animes, filmes"><select id="dl"><option value="pt"'+(d.lang==='pt'?' selected':'')+'>Português</option><option value="en"'+(d.lang==='en'?' selected':'')+'>Inglês</option></select><button class="btn ok" data-act="disc-search">Buscar</button></div>'+
   '<p class="mut">Cada busca custa <b>100 unidades</b> da cota diária de 10.000 (ou seja, no máximo 100 buscas por dia, e menos se você também atualizar o radar). O idioma orienta a busca; o painel ainda esconde canais que declaram outro idioma.</p>'+
   (d.busca?tab(d.busca,'busca')||'<p class="mut">Nada encontrado.</p>':'')+'</div>'+
   '<div class="card"><h2>2) Indicados pelos concorrentes</h2><div class="row"><button class="btn ok" data-act="disc-ind">Ler indicações dos concorrentes</button></div>'+
   '<p class="mut">Lê a seção "Canais em destaque" da página de cada concorrente (1 unidade por concorrente) e ordena pelos canais mais citados.</p>'+
   (d.indicados?tab(d.indicados,'ind'):'')+'</div>'+
   (d.msg?'<p class="mut">'+esc(d.msg)+'</p>':'');
}

function viewAprovacao(){
  var pautas=allPautas(),f=S.pautaFilt;
  var chips=[['todas','Todas'],['pendente','Pendentes'],['aprovada','Aprovadas'],['revisar','Em revisão']].map(function(c){return '<button class="btn'+(f===c[0]?' ok':'')+'" data-act="pf" data-v="'+c[0]+'">'+c[1]+'</button>';}).join(' ');
  var list=pautas.filter(function(p){return f==='todas'||pautaStatus(p.id)===f;});
  var cards=list.map(function(p){
    var st=pautaStatus(p.id),nota=(S.pautas[p.id]&&S.pautas[p.id].nota)||'';
    var ev=p.evid.map(function(e){return '<div class="ev"><b class="mult '+(e.mult>=5?'hot':'warm')+'">'+fmtMult(e.mult)+'</b> · '+esc(e.title)+' <span class="mut">— '+esc(e.canal)+' · '+fmtInt(e.views)+' views'+(e.novo?' · NOVO':'')+'</span></div>';}).join('');
    return '<div class="card" data-pid="'+esc(p.id)+'"><div class="row" style="justify-content:space-between"><h3 style="margin:0">'+esc(p.tema)+'</h3><span><span class="tag">'+esc(p.formato)+'</span><span class="tag '+p.risco.toLowerCase().replace('é','e')+'">RISCO '+esc(p.risco.toUpperCase())+'</span></span></div>'+
     '<p class="mut" style="margin:4px 0 8px">'+esc(p.motivo)+' · multiplicador médio '+fmtMult(p.mediaMult)+'</p>'+ev+
     (st==='revisar'?'<label>Suas observações (vão no prompt)</label><textarea data-note="'+esc(p.id)+'" placeholder="O que mudar nessa pauta?">'+esc(nota)+'</textarea>':'')+
     '<div class="row" style="margin-top:10px"><button class="btn ok" data-act="aprovar" data-id="'+esc(p.id)+'">'+(st==='aprovada'?'✔ Aprovada':'Aprovar')+'</button><button class="btn warn" data-act="revisar" data-id="'+esc(p.id)+'">'+(st==='revisar'?'Em revisão':'Revisar')+'</button>'+
     (st!=='pendente'?'<button class="btn" data-act="pendente" data-id="'+esc(p.id)+'">Voltar para pendente</button>':'')+
     '<button class="btn" data-act="copiar" data-id="'+esc(p.id)+'">Copiar prompt</button></div></div>';
  }).join('');
  return '<div class="card"><div class="row">'+chips+'</div><p class="mut" style="margin:8px 0 0">As pautas vêm dos vídeos de concorrentes que passaram de 2x a mediana do próprio canal. Títulos parecidos são agrupados em um tema.</p></div>'+
   (cards?'<div class="grid2">'+cards+'</div>':'<div class="card mut">Nenhuma pauta aqui. '+(computeRows().length?'Nenhum vídeo de concorrente passou de 2x ainda.':'Atualize o radar primeiro.')+'</div>');
}

function viewAgenda(){
  var days=weekDays(),hours=hoursList(),occ=ownShortSlots(),now=Date.now();
  var ap=allPautas().filter(function(p){return pautaStatus(p.id)==='aprovada';});
  var assigned={};Object.keys(S.agenda).forEach(function(k){assigned[S.agenda[k]]=1;});
  var free=ap.filter(function(p){return !assigned[p.id];});
  var byId={};allPautas().forEach(function(p){byId[p.id]=p;});
  var WD=['dom','seg','ter','qua','qui','sex','sáb'];
  var head='<tr><th>Hora</th>'+days.map(function(d){var a=d.split('-').map(Number);var wd=new Date(Date.UTC(a[0],a[1]-1,a[2])).getUTCDay();return '<th>'+WD[wd]+' '+pad(a[2])+'/'+pad(a[1])+'</th>';}).join('')+'</tr>';
  var body=hours.map(function(h){
    return '<tr><th>'+pad(h)+'h</th>'+days.map(function(ds){
      var key=ds+'|'+h,past=slotMs(ds,h)<=now,v=S.agenda[key];
      if(occ[key])return '<td class="occ'+(past?' past':'')+'" data-slot="'+key+'">já postado<div class="small mut">'+esc(occ[key]).slice(0,40)+'</div></td>';
      if(v==='__ocupado__')return '<td class="occ'+(past?' past':'')+'" data-slot="'+key+'">ocupado'+(past?'':'<div class="small"><button class="btn" style="padding:0 6px" data-act="slot-clear" data-slot="'+key+'">liberar</button></div>')+'</td>';
      if(v){var p=byId[v];return '<td class="has'+(past?' past':'')+'" data-slot="'+key+'"><b>'+esc(p?p.tema:v).slice(0,60)+'</b>'+(past?'':'<div class="small"><button class="btn" style="padding:0 6px" data-act="slot-clear" data-slot="'+key+'">tirar</button></div>')+'</td>';}
      if(past)return '<td class="past" data-slot="'+key+'">—</td>';
      return '<td data-slot="'+key+'"><select data-change="slot" data-slot="'+key+'"><option value="">livre</option>'+free.map(function(p){return '<option value="'+esc(p.id)+'">'+esc(p.tema.slice(0,40))+'</option>';}).join('')+'</select><div class="small"><button class="btn" style="padding:0 6px" data-act="slot-occ" data-slot="'+key+'">ocupado</button></div></td>';
    }).join('')+'</tr>';
  }).join('');
  return '<div class="card"><div class="row"><button class="btn" data-act="wk" data-n="-1">◀ Semana anterior</button><button class="btn" data-act="wk" data-n="0">Esta semana</button><button class="btn" data-act="wk" data-n="1">Próxima semana ▶</button>'+
   '<button class="btn ok" data-act="autofill"'+(free.length?'':' disabled')+'>Encaixar '+free.length+' aprovada(s) nos próximos horários livres</button></div>'+
   '<p class="mut" style="margin:8px 0 0">Horários de Brasília. "Já postado" aparece quando o seu canal tem um Short público naquela hora. Vídeos agendados como privados não aparecem para o painel: use "ocupado" para marcar à mão.</p></div>'+
   (hours.length?'<div class="card tw"><table class="ag">'+head+body+'</table></div>':'<div class="card mut">Defina os horários em Configuração.</div>');
}

function viewConfig(){
  var c=S.cfg;
  return '<div class="card"><h2>Chave da API do YouTube</h2>'+
   '<p class="mut">A chave fica só neste navegador (localStorage). Ela nunca vai para o repositório nem para o chat. Como criar: veja o LEIA-ME.</p>'+
   '<label for="cfg-key">Chave (começa com AIza…)</label><input type="password" id="cfg-key" value="'+esc(c.apiKey)+'" autocomplete="off">'+
   '<div class="row" style="margin-top:8px"><label style="margin:0"><input type="checkbox" id="cfg-show"> mostrar a chave</label><button class="btn ok" data-act="cfg-test">Testar chave</button><button class="btn danger" data-act="cfg-delkey">Apagar chave deste navegador</button></div></div>'+
   '<div class="card"><h2>Seu canal e preferências</h2>'+
   '<label for="cfg-handle">@handle do seu canal</label><input type="text" id="cfg-handle" value="'+esc(c.myHandle)+'">'+
   '<label for="cfg-niche">Nicho (usado nos prompts e na busca)</label><input type="text" id="cfg-niche" value="'+esc(c.niche)+'">'+
   '<label for="cfg-hours">Horários de postagem (Brasília), separados por vírgula</label><input type="text" id="cfg-hours" value="'+esc((c.hours||[]).join(', '))+'">'+
   '<label for="cfg-ex">Títulos reais do seu canal para servir de estilo (um por linha, opcional)</label><textarea id="cfg-ex">'+esc((c.exemplos||[]).join('\n'))+'</textarea>'+
   '<div class="row" style="margin-top:10px"><button class="btn ok" data-act="cfg-save">Salvar</button></div></div>'+
   '<div class="card"><h2>Dados deste navegador</h2><p class="mut">Pautas aprovadas, agenda e diário ficam aqui. Se limpar os dados do navegador, somem.</p><button class="btn danger" data-act="cfg-wipe">Apagar tudo (inclui a chave)</button></div>';
}

var VIEWS={fabrica:viewFabrica,radar:viewRadar,canais:viewCanais,descobrir:viewDescobrir,aprovacao:viewAprovacao,agenda:viewAgenda,config:viewConfig};
function renderTabs(){$('#tabs').innerHTML=TABS.map(function(t){return '<button data-act="tab" data-tab="'+t[0]+'" class="'+(S.tab===t[0]?'active':'')+'">'+t[1]+'</button>';}).join('');}
function render(){
  var keepY=window.scrollY;
  renderTabs();$('#view').innerHTML=VIEWS[S.tab]();renderQuota();
  if(S.tab==='radar'||S.tab==='agenda')window.scrollTo(0,keepY);
}
function setTab(t){if(!VIEWS[t])t='fabrica';S.tab=t;if(location.hash!=='#'+t)history.replaceState(null,'','#'+t);render();window.scrollTo(0,0);}

/* ================= eventos ================= */
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-act]');if(!el)return;
  var a=el.getAttribute('data-act'),id=el.getAttribute('data-id');
  switch(a){
    case 'tab':setTab(el.getAttribute('data-tab'));break;
    case 'banner-x':hideBanner();break;
    case 'modal-x':closeModal();break;
    case 'refresh':refreshAll();break;
    case 'refresh-one':refreshOne(id);break;
    case 'remove':removeChannel(id);break;
    case 'remove-i':removeByIndex(+el.getAttribute('data-i'));break;
    case 'more':S.filt.limit+=100;render();break;
    case 'sort':{var k=el.getAttribute('data-k');if(S.filt.sort===k)S.filt.dir=S.filt.dir==='desc'?'asc':'desc';else{S.filt.sort=k;S.filt.dir='desc';}render();break;}
    case 'add':{var ref=parseChannelInput($('#addin').value);if(!ref){showBanner('Não entendi esse canal. Cole o @handle (ex.: @einerdtv) ou o link do canal.');break;}hideBanner();addChannelRef(ref);break;}
    case 'add-found':{var list=el.getAttribute('data-kind')==='ind'?S.disc.indicados:S.disc.busca;var it=(list||[]).filter(function(x){return x.id===id;})[0];if(it)addChannelRef(null,it.meta);break;}
    case 'disc-search':discoverSearch();break;
    case 'disc-ind':discoverIndicados();break;
    case 'pf':S.pautaFilt=el.getAttribute('data-v');render();break;
    case 'aprovar':case 'revisar':case 'pendente':{
      var p=allPautas().filter(function(x){return x.id===id;})[0];if(!p)break;
      var cur=S.pautas[id]||{};
      S.pautas[id]={status:a==='pendente'?'pendente':(a==='aprovar'?'aprovada':'revisar'),nota:cur.nota||'',snap:p};
      save('pautas',S.pautas);
      log('Você',(a==='aprovar'?'Aprovou':a==='revisar'?'Pediu revisão de':'Devolveu para pendente')+': '+p.tema);render();break;}
    case 'copiar':{var pp=allPautas().filter(function(x){return x.id===id;})[0];if(pp)copyText(promptPauta(pp),'Prompt da pauta');break;}
    case 'wk':{var n=+el.getAttribute('data-n');S.weekOffset=n===0?0:S.weekOffset+n;render();break;}
    case 'autofill':autoFill();break;
    case 'slot-clear':delete S.agenda[el.getAttribute('data-slot')];save('agenda',S.agenda);render();break;
    case 'slot-occ':S.agenda[el.getAttribute('data-slot')]='__ocupado__';save('agenda',S.agenda);render();break;
    case 'diary-clear':S.diary=[];save('diary',S.diary);render();break;
    case 'cfg-save':saveConfigForm(true);break;
    case 'cfg-test':testKey();break;
    case 'cfg-delkey':S.cfg.apiKey='';saveCfg();render();toast('Chave apagada deste navegador.');break;
    case 'cfg-wipe':if(confirm('Apagar TUDO que está salvo neste navegador (chave, pautas, agenda, dados)?')){Object.keys(localStorage).filter(function(k){return k.indexOf(LS)===0;}).forEach(function(k){localStorage.removeItem(k);});location.reload();}break;
  }
});
document.addEventListener('change',function(e){
  var el=e.target;
  if(el.id==='cfg-show'){$('#cfg-key').type=el.checked?'text':'password';return;}
  var a=el.getAttribute&&el.getAttribute('data-change');if(!a)return;
  if(a==='formato'||a==='periodo'||a==='canal'){S.filt[a]=el.value;S.filt.limit=100;render();}
  if(a==='slot'&&el.value){S.agenda[el.getAttribute('data-slot')]=el.value;save('agenda',S.agenda);render();}
});
document.addEventListener('input',function(e){
  if(e.target.id==='dq')S.disc.q=e.target.value;
  var id=e.target.getAttribute&&e.target.getAttribute('data-note');
  if(id){S.pautas[id]=S.pautas[id]||{status:'revisar'};S.pautas[id].nota=e.target.value;save('pautas',S.pautas);}
});
document.addEventListener('keydown',function(e){
  if(e.key==='Enter'&&e.target.id==='addin'){var ref=parseChannelInput(e.target.value);if(ref){hideBanner();addChannelRef(ref);}}
  if(e.key==='Enter'&&e.target.id==='dq')discoverSearch();
});
$('#modal').addEventListener('click',function(e){if(e.target.id==='modal')closeModal();});
window.addEventListener('hashchange',function(){setTab(location.hash.replace('#',''));});

function saveConfigForm(msg){
  var key=$('#cfg-key');if(!key)return;
  S.cfg.apiKey=key.value.trim();
  S.cfg.myHandle=($('#cfg-handle').value.trim()||'@NerdKx');if(S.cfg.myHandle.charAt(0)!=='@')S.cfg.myHandle='@'+S.cfg.myHandle;
  S.cfg.niche=$('#cfg-niche').value.trim()||DEFAULT_CFG.niche;
  var hs=$('#cfg-hours').value.split(/[,;\/\s]+/).map(function(t){var m=/^(\d{1,2})(?::?\d{0,2})?h?$/i.exec(t);return m?Number(m[1]):NaN;}).filter(function(h){return h>=0&&h<=23;});
  S.cfg.hours=Array.from(new Set(hs)).sort(function(a,b){return a-b;});
  S.cfg.exemplos=$('#cfg-ex').value.split('\n').map(function(s){return s.trim();}).filter(Boolean);
  saveCfg();ensureMine();
  if(msg){toast('Configuração salva.');render();}
}
async function testKey(){
  saveConfigForm(false);hideBanner();
  try{
    var meta=await fetchChannel({handle:S.cfg.myHandle});
    var ch=mineChan();if(ch&&!ch.id){Object.assign(ch,meta,{handle:ch.handle||meta.handle});saveChannels();}
    showBanner('Chave funcionando! Canal encontrado: '+meta.title+(meta.subs!=null?' ('+fmtInt(meta.subs)+' inscritos)':'')+'. Agora vá em Radar → Atualizar tudo.',true);
    log('Sistema','Chave testada com sucesso.');
  }catch(err){handleErr(err,'Sistema');}
  render();
}

/* ================= início ================= */
ensureMine();quotaNow();
S.tab=VIEWS[location.hash.replace('#','')]?location.hash.replace('#',''):'fabrica';
render();
if(!String(S.cfg.apiKey||'').trim())showBanner('Para começar, abra a aba Configuração e cole sua chave da API do YouTube. O LEIA-ME explica como criar (é grátis).',true);

window.__fabrica={S:S,computeRows:computeRows,buildPautas:buildPautas,median:median,parseChannelInput:parseChannelInput,parseDuration:parseDuration,promptPauta:promptPauta,mapError:mapError};
})();
</script>
